<ion-content class="ion-padding login-content">
  <div class="login-wrapper">
    <div class="login-header">
      <ion-icon name="lock-closed-outline" class="login-logo"></ion-icon>
      <h1>DAM CRM</h1>
      <p>Gestión de clientes con Supabase</p>
    </div>

    @if (errorMessage) {
      <ion-note class="error-note" color="danger">
        <ion-icon name="alert-circle-outline"></ion-icon>
        {{ errorMessage }}
      </ion-note>
    }

    <form [formGroup]="loginForm" (ngSubmit)="login()">
      <ion-list>
        <ion-item>
          <ion-icon name="mail-outline" slot="start"></ion-icon>
          <ion-input
            label="Email"
            labelPlacement="stacked"
            type="email"
            inputmode="email"
            autocomplete="email"
            placeholder="usuario@email.com"
            formControlName="email"></ion-input>
        </ion-item>

        <ion-item>
          <ion-icon name="lock-closed-outline" slot="start"></ion-icon>
          <ion-input
            label="Contraseña"
            labelPlacement="stacked"
            type="password"
            autocomplete="current-password"
            placeholder="Mínimo 6 caracteres"
            formControlName="password"></ion-input>
        </ion-item>
      </ion-list>

      <ion-button
        type="submit"
        expand="block"
        class="ion-margin-top"
        [disabled]="loginForm.invalid || isLoading">
        @if (isLoading) {
          <ion-spinner name="crescent"></ion-spinner>
        } @else {
          <ion-icon name="log-in-outline" slot="start"></ion-icon>
          Entrar
        }
      </ion-button>
    </form>

    <ion-note class="hint-note">
      Necesitas un usuario creado en Supabase → Authentication → Users.
      El rol se lee de la tabla <code>profiles</code> (admin / user).
    </ion-note>
  </div>
</ion-content>
